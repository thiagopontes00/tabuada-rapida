<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tabuada Rápida</title>
<style>
  :root {
    --bg: #111318;
    --surface: #1c1f26;
    --surface-2: #262a33;
    --text: #f2f3f5;
    --muted: #8b909c;
    --ok: #22a55a;
    --bad: #d64545;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }

  .screen {
    display: none; flex-direction: column;
    min-height: 100dvh; max-width: 460px; margin: 0 auto;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }
  .screen.active { display: flex; }

  .btn {
    width: 100%; padding: 18px; border-radius: var(--radius);
    background: var(--surface); font-size: 18px; font-weight: 600; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn:active { background: var(--surface-2); }
  .btn small { color: var(--muted); font-weight: 400; font-size: 14px; }
  .btn.primary { background: var(--text); color: var(--bg); justify-content: center; }
  .btn.primary:active { opacity: .85; }
  .link { background: none; color: var(--muted); padding: 12px; font-size: 15px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .muted { color: var(--muted); }

  /* Início */
  .home-title { margin: auto 0 32px; }
  .home-title h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -.5px; }
  .home-title p { margin: 0; color: var(--muted); }
  #home .stack { margin-bottom: auto; }

  /* Jogo */
  .topbar { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px; }
  .topbar .center { text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; background: none; color: var(--muted); font-size: 22px; }
  .bar { height: 3px; background: var(--surface); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--muted); width: 0; transition: width .2s linear; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 15px; margin-top: 14px;
          font-variant-numeric: tabular-nums; min-height: 20px; }
  .question-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .new-tag { color: var(--muted); font-size: 14px; letter-spacing: .5px; visibility: hidden; height: 18px; }
  .new-tag.show { visibility: visible; }
  .today { margin-top: 14px !important; font-size: 15px; color: var(--text) !important; opacity: .85; }
  .hard-list { display: flex; flex-direction: column; gap: 8px; }
  .hard { display: flex; justify-content: space-between; background: var(--surface); padding: 12px 14px; border-radius: 12px; font-variant-numeric: tabular-nums; }
  .hard small { color: var(--muted); }
  .question {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(56px, 19vw, 92px); font-weight: 700; letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice {
    height: clamp(84px, 13vh, 112px); border-radius: var(--radius);
    background: var(--surface); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums;
    transition: background-color .12s;
  }
  .choice:active { background: var(--surface-2); }
  .choice.ok { background: var(--ok); }
  .choice.bad { background: var(--bad); }
  .choices.locked .choice { pointer-events: none; }

  /* Resultado */
  .result-head { margin: 24px 0 28px; }
  .result-head h1 { margin: 0 0 4px; font-size: 28px; }
  .score { font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .record { color: var(--ok); font-weight: 600; margin-top: 8px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .kpi { background: var(--surface); border-radius: 12px; padding: 12px; }
  .kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--muted); font-size: 13px; }
  .missed { margin-bottom: 24px; }
  .missed h2 { font-size: 15px; color: var(--muted); font-weight: 500; margin: 0 0 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { background: var(--surface); padding: 8px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; }
  #results .stack { margin-top: auto; }

  /* Progresso */
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin: 16px 0; }
  .cell {
    aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center;
    font-size: clamp(9px, 2.8vw, 13px); font-variant-numeric: tabular-nums; background: var(--surface); color: var(--muted);
  }
  .cell.head { background: none; font-weight: 600; color: var(--muted); }
  .cell.l0 { background: #7a2a2a; color: #fff; }
  .cell.l1 { background: #7a4a24; color: #fff; }
  .cell.l2 { background: #6e6324; color: #fff; }
  .cell.l3 { background: #4d6a28; color: #fff; }
  .cell.l4 { background: #2e7a3e; color: #fff; }
  .cell.l5, .cell.l6 { background: var(--ok); color: #fff; }
  .legend { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  #progress .kpis { margin-top: 20px; margin-bottom: 0; }
  .speed { font-size: 14px; line-height: 1.45; margin: 14px 0 22px; }
  .speed b { color: var(--text); font-weight: 600; }
  #progress .link { margin-top: auto; align-self: center; }
</style>
</head>
<body>

<section id="home" class="screen active">
  <div class="home-title">
    <h1>Tabuada Rápida</h1>
    <p>Toque na resposta certa. O jogo escolhe as contas que você mais precisa treinar.</p>
    <p class="today" id="today"></p>
  </div>
  <div class="stack">
    <button class="btn" data-start="desafio">Desafio <small>60 s · recorde <span id="best">0</span></small></button>
    <button class="btn" data-start="treino">Treino <small>20 contas, sem tempo</small></button>
    <button class="btn" data-go="progress">Meu progresso <small id="homeMastery"></small></button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="quit" aria-label="Sair">✕</button>
    <div class="center" id="status"></div>
    <span></span>
  </div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="meta"><span id="score">0 pts</span><span id="streak"></span></div>
  <div class="question-wrap">
    <div class="new-tag" id="newTag">conta nova</div>
    <div class="question" id="question"></div>
  </div>
  <div class="choices" id="choices"></div>
</section>

<section id="results" class="screen">
  <div class="result-head">
    <h1 id="resTitle"></h1>
    <div class="score" id="resScore">0</div>
    <div class="muted">pontos</div>
    <div class="record" id="resRecord" hidden>Novo recorde!</div>
  </div>
  <div class="kpis">
    <div class="kpi"><b id="resRight">0</b><small>acertos</small></div>
    <div class="kpi"><b id="resAcc">0%</b><small>precisão</small></div>
    <div class="kpi"><b id="resStreak">0</b><small>maior sequência</small></div>
  </div>
  <div class="missed">
    <h2 id="resMissedTitle">Para revisar</h2>
    <div class="tags" id="resMissed"></div>
  </div>
  <div class="stack">
    <button class="btn primary" id="again">Jogar de novo</button>
    <button class="btn" data-go="home" style="justify-content:center">Início</button>
  </div>
</section>

<section id="progress" class="screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home" aria-label="Voltar">←</button>
    <div class="center">Meu progresso</div>
    <span></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span>Precisa treinar</span>
    <i style="background:#7a2a2a"></i><i style="background:#6e6324"></i><i style="background:#4d6a28"></i><i style="background:var(--ok)"></i>
    <span>Sei de cor</span>
  </div>
  <div class="kpis" id="summary"></div>
  <p class="speed muted" id="speed"></p>
  <div class="missed" id="hardBox">
    <h2>Suas maiores dificuldades</h2>
    <div class="hard-list" id="hardList"></div>
  </div>
  <button class="link" id="reset">Apagar progresso</button>
</section>

<script src="js/util.js"></script>
<script src="js/generators/multiplication.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/game.js"></script>
</body>
</html>
